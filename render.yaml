# Render Blueprint — PrintShop Pro
#
# A single web service: the Express API that also serves the built React client.
# The PostgreSQL database is external (Neon). The server applies the SQL
# migrations and demo seed on boot, so a fresh deploy comes up ready to log in.
#
# Deploy: Render dashboard → "New +" → "Blueprint" → pick this repo (branch
# main) → Apply. JWT_SECRET is generated; paste your Neon connection string as
# DATABASE_URL when prompted (sync: false keeps it out of git).

services:
  - type: web
    name: printshop-pro
    runtime: node
    plan: free
    region: oregon
    # Install both packages, then build the SPA into client/dist (served by the
    # API). --include=dev keeps Vite available even with NODE_ENV=production.
    buildCommand: >-
      npm install --prefix server &&
      npm install --prefix client --include=dev &&
      npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # External database (Neon). Prompted at deploy time, stored as a secret.
      # Use Neon's DIRECT connection string (not the -pooler one) — it includes
      # ?sslmode=require, which the server detects to enable SSL.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
